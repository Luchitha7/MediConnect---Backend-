# ============================================================================
#  application.properties  =  the app's settings file
#  Spring Boot reads this automatically on startup. Each line is key=value.
# ============================================================================

# A human-readable name for the app (shows up in logs / actuator).
spring.application.name=mediconnect-backend

# The port the embedded web server listens on.
# We use 8081 because the existing frontend already expects the backend there
# (VITE_API_BASE_URL=http://localhost:8081).
server.port=8081

# ----------------------------------------------------------------------------
# NOTE: There is no database configuration yet - that arrives in Stage 1.
# Right now the app is a pure web server with a single /api/health endpoint.
# ----------------------------------------------------------------------------
